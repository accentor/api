name: Attic

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nix
        uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Attic
        uses: ryanccn/attic-action@v0
        with:
          endpoint: https://attic.chvp.be
          cache: accentor
          token: '${{ secrets.ATTIC_AUTH_TOKEN }}'
      - run: nix build -L --no-link .#accentor-api
      - run: nix build -L --no-link .#accentor-api.env
  shell:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install nix
        uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Attic
        uses: ryanccn/attic-action@v0
        with:
          endpoint: https://attic.chvp.be
          cache: accentor
          token: '${{ secrets.ATTIC_AUTH_TOKEN }}'
      - run: nix build -L --no-link .#devShells.$(nix eval --impure --expr "builtins.currentSystem").accentor-api
      - run: nix build -L --no-link .#devShells.$(nix eval --impure --expr "builtins.currentSystem").deps
