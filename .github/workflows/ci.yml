name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: "test"
    steps:
      - uses: actions/checkout@v7
      - name: Install nix
        uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Attic
        uses: ryanccn/attic-action@v0
        with:
          endpoint: https://attic.chvp.be
          cache: accentor
          token: '${{ secrets.ATTIC_AUTH_TOKEN }}'
      - name: "Setup database"
        run: |
          nix develop --command pg:start
          nix develop --command rails db:setup
      - name: Run tests
        env:
          CI: true
        run: nix develop --command rails test
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # required
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nix
        uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Attic
        uses: ryanccn/attic-action@v0
        with:
          endpoint: https://attic.chvp.be
          cache: accentor
          token: '${{ secrets.ATTIC_AUTH_TOKEN }}'
      - name: Lint with rubocop
        env:
          RAILS_ENV: "test"
        run: nix develop --command rubocop -c .rubocop.yml -f github
      - name: Scan with brakeman
        run: nix develop --command brakeman --no-pager
  annotate-diff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nix
        uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Attic
        uses: ryanccn/attic-action@v0
        with:
          endpoint: https://attic.chvp.be
          cache: accentor
          token: '${{ secrets.ATTIC_AUTH_TOKEN }}'
      - name: "Setup database"
        run: |
          nix develop --command pg:start
          nix develop --command rails db:setup
      - name: Run annotate
        run: nix develop --command annotaterb models
      - name: Check diff
        run: |
          if ! git diff-index --quiet HEAD; then
            printf "Annotate changed the following files:\n"
            git diff --name-only | sed "s/^/* /"
            exit 1
          fi
